<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitespeed Identity Reconciliation</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
            color: #111827;
        }

        p.subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 30px;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #374151;
            display: none; /* Hidden by default */
        }

        .result-header {
            background: #0f172a;
            padding: 8px 16px;
            font-size: 12px;
            color: #94a3b8;
            border-bottom: 1px solid #374151;
            display: flex;
            justify-content: space-between;
        }

        pre {
            margin: 0;
            padding: 20px;
            color: #e2e8f0;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.5;
            overflow-x: auto;
        }

        /* JSON Syntax Highlighting */
        .key { color: #93c5fd; }
        .string { color: #86efac; }
        .number { color: #fca5a5; }
        .boolean { color: #fca5a5; }
        .null { color: #fca5a5; }

        /* Spinner */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Identity Reconciliation</h1>
        <p class="subtitle">Enter customer details to identify and link contacts.</p>
        
        <form id="identifyForm" onsubmit="identify(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="mcfly@hillvalley.edu">
            </div>

            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" id="phoneNumber" placeholder="123456">
            </div>

            <button type="submit" id="submitBtn">
                <div class="spinner" id="spinner"></div>
                <span id="btnText">Identify Contact</span>
            </button>
        </form>

        <div class="result-box" id="resultBox">
            <div class="result-header">
                <span>JSON RESPONSE</span>
                <span id="statusCode">200 OK</span>
            </div>
            <pre id="output"></pre>
        </div>
    </div>

    <script>
        async function identify(event) {
            event.preventDefault();

            const emailInput = document.getElementById('email').value.trim();
            const phoneInput = document.getElementById('phoneNumber').value.trim();
            const output = document.getElementById('output');
            const resultBox = document.getElementById('resultBox');
            const submitBtn = document.getElementById('submitBtn');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btnText');
            const statusCode = document.getElementById('statusCode');

            // Basic Validation
            if (!emailInput && !phoneInput) {
                alert("Please enter at least an email or phone number.");
                return;
            }

            // Loading State
            submitBtn.disabled = true;
            spinner.style.display = 'block';
            btnText.textContent = 'Processing...';
            resultBox.style.display = 'none';

            const payload = {
                email: emailInput || null,
                phoneNumber: phoneInput || null
            };

            try {
                const response = await fetch('/identify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                // Show Result
                resultBox.style.display = 'block';
                statusCode.textContent = `${response.status} ${response.statusText}`;
                statusCode.style.color = response.ok ? '#86efac' : '#fca5a5';
                
                // Format JSON with colors
                output.innerHTML = syntaxHighlight(data);

            } catch (error) {
                resultBox.style.display = 'block';
                output.textContent = "Error: " + error.message;
                statusCode.textContent = "ERROR";
                statusCode.style.color = '#fca5a5';
            } finally {
                // Reset Loading State
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Identify Contact';
            }
        }

        // Helper to colorize JSON
        function syntaxHighlight(json) {
            if (typeof json != 'string') {
                json = JSON.stringify(json, undefined, 2);
            }
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                var cls = 'number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'key';
                    } else {
                        cls = 'string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'boolean';
                } else if (/null/.test(match)) {
                    cls = 'null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }
    </script>
</body>
</html>
